@PART:HAS[@MODULE[ModuleRCS*]]:NEEDS[Waterfall,RealismOverhaul]:FOR[zz_BetterRCS]
{
	// Default type (Nitrogen)
	@MODULE[ModuleWaterfallFX]:HAS[@CONTROLLER[rcs]],*
	{
		@TEMPLATE
		{
			@templateName = BetterRCS_LowVacSLPressure
		}
	}

	// Config for B9PartSwitch
        // In RO's Waterfall config, they only provide these three variant.
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[rowaterfallMainPlumeSwitch]],*
	{
		@SUBTYPE[cold-gas],* { @MODULE { @DATA { @TEMPLATE {
			@templateName = BetterRCS_LowVacSLPressure
		} } } }
		@SUBTYPE[monoprop],* { @MODULE { @DATA { @TEMPLATE {
			@templateName = BetterRCS_LowVacPressure
		} } } }
		@SUBTYPE[hypergolic],* { @MODULE { @DATA { @TEMPLATE {
			@templateName = BetterRCS_Base
		} } } }
	}

	MODULE
	{
		name = BetterRCSModifiedTag
	}
}
