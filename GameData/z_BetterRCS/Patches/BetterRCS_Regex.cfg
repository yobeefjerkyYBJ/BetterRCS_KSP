@PART:HAS[@MODULE[ModuleRCSFX]:HAS[@var_CurveISP_VacParse:HAS[#key[Vac_LowPressure]]&@var_CurveISP_SLParse:HAS[#key[SL_LowPressure]]]]:NEEDS[Waterfall,!ROWaterfall]:FOR[z_BetterRCS]
