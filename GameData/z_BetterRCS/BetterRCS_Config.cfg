// This file exists to allow you to disable BetterRCS for any RCS parts specified below.
// 
// Currently, the approach required is to add a patch with every part you want excluded, replace the blank in @PART[blank] below with the ID of the to be excluded parts.
// You can also include multiple parts in the same patch by separating their IDs with |, this tells MM that it's pointing at more than one part.
// It should look something like this, @PART[blank|null|empty], MM will look for parts with the respective IDs.
//
// Below is an example of the patch needed to properly exclude a part.
// 
//@PART[blank]:FOR[z_BetterRCS]:NEEDS[Waterfall]
//{
//	&MODULE[BetterRCSDisabled]
//}
